# Acceptance tests against a RouterOS CHR running in docker.
#
# Facts about evilfreelancer/docker-routeros (from its public README):
#  - RouterOS CHR runs inside QEMU in the container; /dev/kvm is optional
#    (without it QEMU emulation is used, much slower), /dev/net/tun and
#    NET_ADMIN are needed for the two-network TAP mode; the image's own
#    default entrypoint is used (no custom entrypoint script).
#  - Exposed ports: 21, 22, 23, 80, 443, 8291, 8728, 8729. In single-network
#    mode QEMU forwards them into the guest.
#  - The README documents no credentials: stock CHR login is admin with an
#    empty password.
#  - Only WebFig/REST on http (80) and the API (8728) are enabled by default;
#    HTTPS (443) needs a certificate and www-ssl, which
#    .github/scripts/setup_routeros.go configures over the API (8728).
#    Hence readiness is polled on REST over http (80), and https (443) is
#    verified after the setup step.
#  - Boot takes 30-60 seconds with KVM, longer without.
#
# This workflow has no secrets and must stay that way: it runs on pull
# requests, including those from forks.
name: Acceptance (CHR)
on:
  pull_request:
    branches:
      - 'main'
      - 'devel'
    paths:
      - 'main.go'
      - 'routeros/*.go'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: CHR ${{ matrix.routeros_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - routeros_version: "7.23.8"
            ros_version: "7.23"
          - routeros_version: "7.24.6"
            ros_version: "7.24"

    services:
      routeros:
        image: evilfreelancer/docker-routeros:${{ matrix.routeros_version }}
        ports:
          - 80:80
          - 443:443
          - 8728:8728
          - 8729:8729
        options: >-
          --cap-add=NET_ADMIN
          --device /dev/net/tun
          --device /dev/kvm

    steps:
      - name: Wait for RouterOS REST
        run: |
          # Bounded wait: 30 attempts x 10 s, then fail with container logs.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              -u admin: http://127.0.0.1/rest/system/resource || true)
            echo "attempt $i/30: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "RouterOS did not become ready in 300 s; container logs:"
          docker logs ${{ job.services.routeros.id }} 2>&1 | tail -n 200
          exit 1

      - name: Check out code into the Go module directory
        uses: actions/checkout@v6

      - name: Cache restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Get dependencies
        run: go mod download

      - name: Build
        run: go build -v .

      - name: Preparing RouterOS for testing
        run: go run .github/scripts/setup_routeros.go
        env:
          ROS_USERNAME: admin
          ROS_PASSWORD: ''
          ROS_IP_ADDRESS: 127.0.0.1

      - name: Wait for RouterOS REST over HTTPS
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 5 \
              -u admin: https://127.0.0.1/rest/system/resource || true)
            echo "attempt $i/12: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "HTTPS REST is not available after setup; container logs:"
          docker logs ${{ job.services.routeros.id }} 2>&1 | tail -n 200
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # The evilfreelancer image has a single NIC (ether1), while these tests
      # need ether2-ether4 (bonding, ethernet, hotspot, BFD, OSPF template,
      # sniffer). They are skipped until a multi-NIC CHR image is available;
      # see "Acceptance tests" in FORK.md.
      - name: Run acceptance tests
        run: >-
          go test -timeout 30m -v ./routeros
          -skip '^(TestAccInterfaceBondingTest_basic|TestAccInterfaceEthernetTest_basic|TestAccInterfaceEthernetTest_import|TestAccIpHotspotTest_basic|TestAccRoutingBfdConfigurationTest_basic|TestAccRoutingOspfInterfaceTemplateTest_basic|TestAccToolSnifferTest_basic)$'
        env:
          ROS_HOSTURL: https://127.0.0.1
          ROS_USERNAME: admin
          ROS_PASSWORD: ''
          ROS_INSECURE: true
          TF_ACC: 1
          ROS_VERSION: ${{ matrix.ros_version }}
