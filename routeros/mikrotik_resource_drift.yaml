7.1:
  /ip/dhcp-server:
    - tf: src_address
      mt: server-address
  /routing/ospf/area:
    - tf: nssa_translate
      mt: nssa-translator
7.17:
  /interface/wireguard/peers:
    - tf: is_responder
      mt: responder
7.18:
  /container:
    - tf: tag
      mt: repo
7.19:
  /routing/bgp/connection:
    - tf: address_families
      mt: afi
  /routing/bgp/template:
    - tf: address_families
      mt: afi
7.20:
  /interface/vxlan:
    - tf: vrf
      mt: vtep-vrf
  # The schema carries the current names (envlists, memory_high, list);
  # older RouterOS gets the old parameter names.
  /container:
    - tf: envlists
      mt: envlist
      before: true
  /container/config:
    - tf: memory_high
      mt: ram-high
      before: true
  /container/envs:
    - tf: list
      mt: name
      before: true
7.21:
  # Mount lists appeared in 7.21 (upstream PR #910).
  /container:
    - tf: mountlists
      mt: mounts
      before: true
  /container/mounts:
    - tf: list
      mt: name
      before: true
  /ip/ssh:
    - tf: always-allow-password-login
      mt: password-authentication
7.24:
  /ip/service:
    - tf: address
      mt: available-from
